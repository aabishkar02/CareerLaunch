<!DOCTYPE html>
<html>
<body>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io("http://localhost:3000"); // change port if needed

    socket.on("connect", () => {
      console.log("✅ Connected! ID:", socket.id);
    });

    socket.on("disconnect", () => {
      console.log("Disconnected");
    });
  </script>
</body>
</html>
